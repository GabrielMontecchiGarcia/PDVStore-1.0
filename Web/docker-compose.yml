# Ambiente local do PDVStore Web: apenas o SQL Server.
# A API (.NET) e o frontend (React) rodam na máquina do desenvolvedor
# (dotnet run / npm run dev) — ver Web/README.md.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pdvstore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: "Developer"
      TZ: "UTC"
    ports:
      - "1433:1433"
    volumes:
      - pdvstore-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pdvstore-sqlserver-data:
